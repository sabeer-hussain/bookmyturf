name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Service containers for the real-database e2e suite. The e2e specs boot the full
    # AppModule, which connects to both PostgreSQL and Redis on startup.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookmyturf
          POSTGRES_PASSWORD: bookmyturf_dev
          POSTGRES_DB: bookmyturf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookmyturf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only, non-production values. Unit + build use these; e2e loads .env.test
      # (created below) via `dotenv -e .env.test`, which points at the dedicated test DB.
      DATABASE_URL: postgresql://bookmyturf:bookmyturf_dev@localhost:5432/bookmyturf_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production-32
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-32

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @bookmyturf/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      # e2e loads apps/api/.env.test via dotenv-cli; create it from the committed example.
      - name: Prepare e2e test env
        run: cp apps/api/.env.test.example apps/api/.env.test

      - name: Migrate + seed test database
        run: |
          pnpm --filter @bookmyturf/api exec prisma migrate deploy
          pnpm --filter @bookmyturf/api exec prisma db seed

      - name: Test (unit)
        run: pnpm test

      - name: Test (e2e — real Postgres + Redis)
        run: pnpm --filter @bookmyturf/api test:e2e
